services:
  postgres:
    image: postgres:16-alpine
    container_name: mini_ad_postgres
    restart: always
    environment:
      POSTGRES_USER: adserver_user
      POSTGRES_PASSWORD: adserver_password
      POSTGRES_DB: mini_ad_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mini_ad_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
